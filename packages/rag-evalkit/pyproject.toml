[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evalkit"
version = "0.2.0"
description = "Portable, evidence-preserving evaluation of vector stores, RAG pipelines, models and harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10"]
langchain = ["langchain-core>=1.6.12,<2"]
llamaindex = ["llama-index-core>=0.14.25,<0.15"]
agents = ["openai-agents>=0.24,<1"]
openai-agents = ["openai-agents>=0.24,<1"]
integrations = ["langchain-core>=1.6.12,<2", "llama-index-core>=0.14.25,<0.15", "openai-agents>=0.24,<1"]

[project.scripts]
rag-eval = "rag_evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_evalkit = ["models/*.md", "embeddings/*.md", "integrations/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicit isolated backend integration", "external_sdk: installed third-party SDK integration without paid network calls"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
