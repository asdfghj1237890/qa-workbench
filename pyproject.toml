[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-workbench"
version = "0.1.0"
description = "Adapter-driven QA execution, evidence workbench and layered test architecture"
readme = "BACKEND.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.139,<1", "pydantic>=2.12,<3", "uvicorn>=0.40,<1", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
qa-workbench = "qa_workbench.cli:main"
qa-test-layers = "qa_workbench.testing.layers:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
